<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VOLTIX — AI-powered electrical & electronics engineering assistant. Conversational AI, deterministic solvers, FAISS RAG, and engineering tools.">
  <title>{% block title %}VOLTIX — EEE AI Engineering Assistant{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M13 10V3L4 14h7v7l9-11h-7z'/></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Highlight.js (code syntax) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Marked.js (markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- VOLTIX Design System -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Instant theme flash prevention -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('voltix_theme') || localStorage.getItem('studio_theme') || 'dark';
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- Core API Client (unchanged) -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>

  <!-- Rendering utilities -->
  <script src="{{ url_for('static', filename='js/math_renderer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/code_highlighter.js') }}"></script>

  <!-- Application Modules -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/solvers.js') }}"></script>
  <script src="{{ url_for('static', filename='js/files.js') }}"></script>
  <script src="{{ url_for('static', filename='js/project.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
