# VOLTIX System Hyperparameters & Agentic AI Configuration

system:
  app_name: "VOLTIX"
  version: "2.0.0"
  debug: true
  host: "0.0.0.0"
  port: 5000

ollama:
  base_url: "http://localhost:11434"
  default_model: "qwen2.5:7b"
  timeout_seconds: 90
  options:
    temperature: 0.1
    top_p: 0.9
    top_k: 40

  # Model Tiering Matrix
  models:
    router: "qwen2.5:3b"
    tool_executor: "qwen2.5:7b"
    fast_reasoning: "deepseek-v4-flash:cloud"
    planner: "gemma4:cloud"
    deep_specialist: "gemma4:31b-cloud"
    frontier_reasoning: "gpt-oss:120b-cloud"

agentic:
  max_react_iterations: 5
  enable_planner: true
  enable_web_tools: true

rag:
  embedding_model: "BAAI/bge-small-en-v1.5"
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  similarity_threshold: 0.65

storage:
  db_filename: "voltix.db"
  faiss_index_filename: "faiss.index"
  faiss_metadata_filename: "metadata.pkl"
  upload_max_size_mb: 32

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

