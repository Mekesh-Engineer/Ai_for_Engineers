# Training & Model Configuration for Person Detection & Video Tracking

model:
  name: "YOLOv8_Person_Detector"
  architecture: "yolov8n.pt"  # Lightweight YOLOv8 Nano pre-trained backbone
  num_classes: 1
  class_names: ["person"]

dataset:
  name: "Penn_Fudan_Pedestrian_Dataset"
  data_yaml_path: "datasets/data.yaml"
  images_dir: "data/images"
  labels_dir: "data/labels"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  img_size: 640

training:
  epochs: 15
  batch_size: 8
  learning_rate: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  early_stopping_patience: 10
  random_seed: 42
  device: "0"  # Will automatically fall back to "cpu" if CUDA is unavailable

inference:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 100

tracking:
  tracker_type: "bytetrack.yaml"  # Built-in ByteTrack multi-object tracker
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30
  match_thresh: 0.8

output:
  model_save_dir: "models/"
  best_model_path: "models/best.pt"
  results_dir: "results/"
  detections_dir: "results/detections/"
  metrics_dir: "results/metrics/"
  pr_curve_plot: "results/metrics/precision_recall_curve.png"
  confusion_matrix_plot: "results/metrics/confusion_matrix.png"
  iou_dist_plot: "results/metrics/iou_distribution.png"
  training_results_csv: "results/training_results.csv"
  detection_report_txt: "results/metrics/detection_report.txt"
  tracked_video_output: "results/tracked_output.mp4"
